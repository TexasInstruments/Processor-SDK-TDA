
# location of config
tidl_config_file_path   /ti/j7/workarea/tiovx/conformance_tests/test_data/tivx/tidl_models/tidl_io_mobilenet_v1_1.bin

# location of network
tidl_network_file_path  /ti/j7/workarea/tiovx/conformance_tests/test_data/tivx/tidl_models/tidl_net_mobilenet_v1.bin

# location of input files (YUV format, 1024x512)
input_file_path 	/ti/j7/workarea/tiovx/conformance_tests/test_data/psdkra/app_tidl
# Input/output sizes
# in_size: Input YUV file resolution
in_size   1024 512

# dl_size: TIDL network input size (MobileNetV1 uses 224x224)
dl_size   224 224

# out_size: Display/output size
out_size  800 400

# path where ti_logo.bmp file is kept
ti_logo_file_path       /ti/j7/workarea/tiovx/conformance_tests/test_data/tivx/tidl_models

# location of output
output_file_path        ./app_tidl_out

# display option, 0 - console output, 1 - display on screen (DSS)
display_option    0

# delay between 2 images in msecs
delay 0

# number of frames to process per iteration
num_frames 30

# number of iterations to run
num_iterations 1

# 1, interactive mode, 0 no user interaction mode
is_interactive 0

# Enable pipeline mode (0: sequential, 1: pipelined)
enable_pipeline_flow 0

# if display_option is 1, then
# 1, use dual display, 0 use single display
use_dual_display 0
