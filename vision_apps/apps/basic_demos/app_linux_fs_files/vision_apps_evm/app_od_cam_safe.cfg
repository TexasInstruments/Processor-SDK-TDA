# location of conifg
tidl_config   /opt/vision_apps/test_data/psdkra/tidl_models/tidl_io_peele_300_1.bin

# location of network
tidl_network  /opt/vision_apps/test_data/psdkra/tidl_models/tidl_net_peele_300.bin

# size given to DL network (width height)
# This should should not be less than 4x of input width or height
dl_size   1024 512

# size given for display (width height)
# This should should not be less than 4x of input width or height
out_size  1024 512

# vizualization threshold
viz_th    0.95

# Maximum number of Object Detection classes
num_classes 90

# If 1 - Enable display 0 - Disable display
display_option      1

# interactive input mode 1: yes, 0: no
is_interactive      1

# Select C7x core for j784s4-TIDL 1 -DSP_C7X_2, 2-DSP_C7X_3, 3-DSP_C7X_4
cpu_core_id     1

# how many frames to wait between verification checks
check_interval 5

# maximum allowed execution time for AEWB node in nanoseconds (vx_perf_t.tmp)
aewb_max_time     7000000

# maximum allowed execution time for pre-processing node in nanoseconds (vx_perf_t.tmp)
preproc_max_time  8000000

# maximum allowed execution time for post-processing node in nanoseconds (vx_perf_t.tmp)
postproc_max_time 4000000

# Test option selector:
# 0 - Disabled (normal operation, all safety mechanisms active without forced faults)
#
# Reciprocal Comparison (RC) tests:
# These modes run the application in normal conditions to verify that the
# Reciprocal Comparison mechanism does NOT report any errors.
# 1 - R5F (AEWB)     Reciprocal Comparison (normal run, no faults injected)
# 2 - A72 (PreProc)  Reciprocal Comparison (normal run, no faults injected)
# 3 - C7x (PostProc) Reciprocal Comparison (normal run, no faults injected)
#
# Program Sequence Monitoring (PSM) tests:
# These modes run the application in normal conditions to verify that the
# Program Sequence Monitoring mechanism does NOT report timing or ordering errors.
# 4 - R5F (AEWB)     Program Sequence Monitoring (normal run, no faults injected)
# 5 - A72 (PreProc)  Program Sequence Monitoring (normal run, no faults injected)
# 6 - C7x (PostProc) Program Sequence Monitoring (normal run, no faults injected)

test_option      0
