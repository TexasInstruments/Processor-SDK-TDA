
# sensor selection
# 0 : IMX390/SIM-CAMERA (for TDA5x)
# 1 : AR0233
# 2 : AR0820
sensor_index   0

# LDC Enable
ldc_enable 0

# Number of frames to run
num_frames_to_run  1000000000

# enable interactive mode
is_interactive    1

# File read mode: bypass live capture and read RAW frames from disk
# 0 : live capture (default)
# 1 : read RAW frame sequence from filesystem instead of a live sensor.
#     Works with is_interactive=0 (runs num_frames_to_run frames then exits)
#     and is_interactive=1 (loops the sequence until 'x' is pressed).
file_read_enable   0

# Directory containing a RAW frame sequence named img_0000.raw, img_0001.raw for TDA5x
file_read_dir_tda5   /opt/vision_apps/test_data/psdkra/app_single_cam/raw_frames_640x480/

# Directory containing a RAW frame sequence named img_0000.raw, img_0001.raw for TDA4x
file_read_dir_tda4   /opt/vision_apps/test_data/psdkra/app_single_cam/raw_frames_1936x1096/

# Number of files in the sequence (frame index wraps via modulo)
file_read_seq_count   12

# Starting sequence index
file_read_start_seq   0
#
# Continuously dump RAW/VISS/H3A/LDC(/scaler) debug images to
# VX_TEST_DATA_PATH every frame while the graph runs.
# 0 : disabled (default)
# 1 : enabled
save_debug_images_enable   0
